<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <script>
    try {
      var q = localStorage.getItem("tk-pal");
      document.documentElement.dataset.palette = /^(netflix|mono|hijau|samudra|senja|blush)$/.test(q) ? q : "netflix";
      var m = localStorage.getItem("tk-theme") || "dark";
      document.documentElement.dataset.theme = m === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : m;
    } catch(e) {
      document.documentElement.dataset.theme = "dark";
      document.documentElement.dataset.palette = "netflix";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tati’e Kitchen — Kasir Tablet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
