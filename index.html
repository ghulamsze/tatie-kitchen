<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <script>
    try {
      if (localStorage.getItem("tk-theme-v2") !== "1") {
        if (localStorage.getItem("tk-theme") === "light") {
          localStorage.setItem("tk-theme", "system");
        }
        localStorage.setItem("tk-theme-v2", "1");
      }
      if (localStorage.getItem("tk-palette-v4") !== "1") {
        localStorage.setItem("tk-pal", "hijau");
        localStorage.setItem("tk-palette-v4", "1");
      }
      var q = localStorage.getItem("tk-pal");
      document.documentElement.dataset.palette = /^(hijau|mono|netflix|samudra|senja|blush)$/.test(q) ? q : "hijau";
      var m = localStorage.getItem("tk-theme") || "system";
      var isDark = matchMedia("(prefers-color-scheme: dark)").matches;
      var eff = m === "system" ? (isDark ? "dark" : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) : m;
      document.documentElement.dataset.theme = eff;
      document.documentElement.style.colorScheme = eff;
    } catch(e) {
      document.documentElement.dataset.theme = "dark";
      document.documentElement.dataset.palette = "hijau";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tati’e Kitchen — Kasir Tablet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
